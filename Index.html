<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1f2d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dishwasher">
  <title>Dishwasher</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1f2d; }
    body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  </style>
  <script>
    const manifest = {
      name: "Dishwasher Tracker", short_name: "Dishwasher",
      start_url: ".", display: "standalone", orientation: "portrait",
      background_color: "#0d1f2d", theme_color: "#0d1f2d",
      icons: [{ src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%230d1f2d'/><text x='96' y='130' text-anchor='middle' font-size='110'>🍽️</text></svg>`), sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" }]
    };
    const b = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const l = document.createElement("link"); l.rel = "manifest"; l.href = URL.createObjectURL(b);
    document.head.appendChild(l);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const PEOPLE = [
      { id: "jon",   name: "Jon",   emoji: "🧑", color: "#4ab8e8", dark: "#0d2030" },
      { id: "daisy", name: "Daisy", emoji: "👧", color: "#f07ab8", dark: "#2d0f1e" },
      { id: "freya", name: "Freya", emoji: "👩", color: "#f0b050", dark: "#2d1e06" },
    ];

    const KEY = "dishwasher_people_v1";
    const load = () => { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : []; } catch { return []; } };
    const save = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };

    const fmtTime  = d => new Date(d).toLocaleTimeString("en-GB",  { hour:"2-digit", minute:"2-digit" });
    const fmtDate  = d => new Date(d).toLocaleDateString("en-GB",  { weekday:"long", day:"numeric", month:"long" });
    const fmtShort = d => new Date(d).toLocaleDateString("en-GB",  { weekday:"short", day:"numeric", month:"short", year:"2-digit" });

    const startOfDay   = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
    const startOfWeek  = d => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
    const startOfMonth = d => { const x = startOfDay(d); x.setDate(1); return x; };

    const C = { bg:"#0d1f2d", card:"#122130", border:"#1a3045", text:"#d8e8f0", muted:"#4a6070", dim:"#1e3448", red:"#e87070", green:"#5ecb88" };

    const STARS = [
      [8,3],[20,9],[35,4],[50,14],[65,7],[78,12],[90,3],[95,20],
      [5,25],[15,35],[30,20],[45,30],[60,22],[73,32],[87,18],
      [12,45],[38,52],[62,42],[82,50],[25,60],[55,65],[78,58],
    ].map(([x,y],i) => ({ x, y, r:i%4===0?1.6:i%3===0?1.1:0.8, o:0.08+(i%5)*0.04 }));

    function App() {
      const [entries, setEntries] = useState(() => load());
      const [tab,     setTab]     = useState("home");
      const [flash,   setFlash]   = useState(null);
      const [toast,   setToast]   = useState(null);
      const [delId,   setDelId]   = useState(null);

      const persist = data => { save(data); setEntries(data); };
      const showToast = msg => { setToast(msg); setTimeout(() => setToast(null), 2000); };

      const logIt = personId => {
        persist([{ id: Date.now(), ts: new Date().toISOString(), person: personId }, ...entries]);
        setFlash(personId); setTimeout(() => setFlash(null), 500);
        showToast(`${PEOPLE.find(p=>p.id===personId).name} logged it! 🍽️`);
      };

      const del = id => { persist(entries.filter(e => e.id !== id)); setDelId(null); showToast("Deleted"); };

      const now = new Date();
      const stats = useMemo(() => {
        const tod = startOfDay(now), wk = startOfWeek(now), mo = startOfMonth(now);
        const people = PEOPLE.map(p => ({
          ...p,
          today: entries.filter(e=>e.person===p.id&&new Date(e.ts)>=tod).length,
          week:  entries.filter(e=>e.person===p.id&&new Date(e.ts)>=wk).length,
          month: entries.filter(e=>e.person===p.id&&new Date(e.ts)>=mo).length,
          total: entries.filter(e=>e.person===p.id).length,
        }));
        const weeks = Array.from({length:8},(_,i) => {
          const ws = new Date(startOfWeek(now)); ws.setDate(ws.getDate()-(7-i-1)*7);
          const we = new Date(ws); we.setDate(we.getDate()+7);
          const counts = {}; PEOPLE.forEach(p=>{counts[p.id]=entries.filter(e=>e.person===p.id&&new Date(e.ts)>=ws&&new Date(e.ts)<we).length;});
          return { label:i===7?"This\nwk":i===6?"Last\nwk":`${7-i}w`, counts, total:Object.values(counts).reduce((a,b)=>a+b,0) };
        });
        return { people, weeks, total:entries.length };
      }, [entries]);

      return (
        <div style={{minHeight:"100dvh",background:C.bg,color:C.text,fontFamily:"'DM Sans',sans-serif",maxWidth:430,margin:"0 auto",position:"relative",overflowX:"hidden"}}>
          <svg style={{position:"fixed",inset:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:0}} xmlns="http://www.w3.org/2000/svg">
            {STARS.map((s,i)=><circle key={i} cx={`${s.x}%`} cy={`${s.y}%`} r={s.r} fill="white" opacity={s.o}/>)}
          </svg>

          <div style={{position:"relative",zIndex:1,padding:"max(env(safe-area-inset-top,16px),22px) 20px 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontFamily:"'Lora',serif",fontSize:24,fontWeight:600,color:"#4ab8e8",lineHeight:1}}>Dishwasher</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4,letterSpacing:"0.05em"}}>{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
            </div>
            <div style={{fontSize:34}}>🍽️</div>
          </div>

          <div style={{position:"relative",zIndex:1,padding:"12px 16px 88px"}}>
            {tab==="home"    && <HomeTab    stats={stats} flash={flash} logIt={logIt} entries={entries}/>}
            {tab==="history" && <HistoryTab entries={entries} onDelete={setDelId}/>}
            {tab==="stats"   && <StatsTab   stats={stats}/>}
          </div>

          <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"#0a1825",borderTop:`1px solid ${C.border}`,display:"flex",padding:`8px 0 max(14px,env(safe-area-inset-bottom,14px))`,zIndex:10}}>
            {[{id:"home",ico:"🏠",lbl:"Home"},{id:"history",ico:"📋",lbl:"History"},{id:"stats",ico:"📊",lbl:"Stats"}].map(({id,ico,lbl})=>(
              <button key={id} onClick={()=>setTab(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,background:"none",border:"none",color:tab===id?"#4ab8e8":C.muted,fontSize:9,cursor:"pointer",fontFamily:"inherit",letterSpacing:"0.06em",textTransform:"uppercase",padding:"3px 0"}}>
                <span style={{fontSize:22}}>{ico}</span>{lbl}
              </button>
            ))}
          </nav>

          {delId&&(
            <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:60,padding:20}}>
              <div style={{background:"#0f1e2e",borderRadius:16,border:`1px solid ${C.border}`,padding:"24px 20px",width:"100%",maxWidth:340}}>
                <div style={{fontFamily:"'Lora',serif",fontSize:18,color:C.red,marginBottom:8}}>Delete this entry?</div>
                <div style={{color:C.muted,fontSize:13,marginBottom:20}}>{(()=>{const e=entries.find(e=>e.id===delId);return e?`${fmtShort(e.ts)} at ${fmtTime(e.ts)} — ${PEOPLE.find(p=>p.id===e.person)?.name}`:""})()}</div>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setDelId(null)} style={{flex:1,background:"transparent",color:C.muted,border:`1.5px solid ${C.muted}`,borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Keep</button>
                  <button onClick={()=>del(delId)} style={{flex:1,background:C.red,color:"#fff",border:"none",borderRadius:10,padding:"10px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>
                </div>
              </div>
            </div>
          )}

          {toast&&<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:C.green,color:"#fff",borderRadius:10,padding:"10px 20px",fontSize:13,fontWeight:500,zIndex:200,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,.5)"}}>{toast}</div>}
        </div>
      );
    }

    function HomeTab({stats,flash,logIt,entries}) {
      const last=entries[0], lastP=last?PEOPLE.find(p=>p.id===last.person):null;
      return (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{fontSize:11,color:C.muted,textAlign:"center",letterSpacing:"0.08em",textTransform:"uppercase",paddingTop:8,paddingBottom:4}}>Who emptied it?</div>
          {PEOPLE.map(p=>{
            const isF=flash===p.id, tc=stats.people.find(sp=>sp.id===p.id)?.today||0;
            return(
              <button key={p.id} onClick={()=>logIt(p.id)} style={{width:"100%",background:isF?p.color:`linear-gradient(135deg,${p.color}18 0%,${p.color}08 100%)`,border:`2px solid ${isF?p.color:p.color+"44"}`,borderRadius:18,padding:"20px 24px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",transform:isF?"scale(0.97)":"scale(1)",transition:"all 0.15s ease",boxShadow:isF?`0 0 30px ${p.color}55`:"0 2px 12px rgba(0,0,0,0.3)",fontFamily:"inherit"}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:36}}>{p.emoji}</span>
                  <div style={{textAlign:"left"}}>
                    <div style={{fontFamily:"'Lora',serif",fontSize:22,color:isF?p.dark:p.color,fontWeight:600,lineHeight:1}}>{p.name}</div>
                    <div style={{fontSize:12,color:isF?p.dark+"aa":C.muted,marginTop:3}}>{tc===0?"not today yet":tc===1?"once today":`${tc}× today`}</div>
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:11,color:isF?p.dark+"99":C.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:2}}>Total</div>
                  <div style={{fontFamily:"'Lora',serif",fontSize:28,color:isF?p.dark:p.color,lineHeight:1}}>{stats.people.find(sp=>sp.id===p.id)?.total||0}</div>
                </div>
              </button>
            );
          })}
          {last&&lastP&&(
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"12px 16px",marginTop:4,display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:20}}>{lastP.emoji}</span>
              <div>
                <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:2}}>Last emptied</div>
                <div style={{fontSize:14,color:C.text}}><span style={{color:lastP.color,fontWeight:500}}>{lastP.name}</span>{" · "}{fmtShort(last.ts)} at {fmtTime(last.ts)}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function HistoryTab({entries,onDelete}) {
      if(!entries.length) return <div style={{textAlign:"center",padding:"60px 20px",color:C.muted}}><div style={{fontSize:52,marginBottom:12}}>🍽️</div><div style={{fontFamily:"'Lora',serif",fontSize:18,color:C.text}}>Nothing logged yet</div></div>;
      const groups=[];let cur=null;
      entries.forEach(e=>{const d=fmtDate(e.ts);if(d!==cur){groups.push({date:d,items:[]});cur=d;}groups[groups.length-1].items.push(e);});
      return(
        <div>
          <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",padding:"8px 2px 10px"}}>{entries.length} total</div>
          {groups.map(g=>(
            <div key={g.date} style={{marginBottom:14}}>
              <div style={{fontSize:11,color:"#4ab8e8",fontWeight:500,marginBottom:6,paddingLeft:2}}>{g.date}</div>
              {g.items.map(e=>{const p=PEOPLE.find(p=>p.id===e.person);return(
                <div key={e.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${p?.color||C.border}`,borderRadius:12,padding:"11px 14px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:20}}>{p?.emoji}</span>
                    <div><div style={{fontSize:14,color:p?.color,fontWeight:500}}>{p?.name}</div><div style={{fontSize:12,color:C.muted}}>{fmtTime(e.ts)}</div></div>
                  </div>
                  <button onClick={()=>onDelete(e.id)} style={{background:"transparent",border:`1px solid ${C.dim}`,borderRadius:8,padding:"5px 10px",color:C.muted,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Delete</button>
                </div>
              );})}
            </div>
          ))}
        </div>
      );
    }

    function StatsTab({stats}) {
      if(!stats.total) return <div style={{textAlign:"center",padding:"60px 20px",color:C.muted}}><div style={{fontSize:52,marginBottom:12}}>📊</div><div style={{fontFamily:"'Lora',serif",fontSize:18,color:C.text}}>No data yet</div></div>;
      const maxW=Math.max(...stats.weeks.map(w=>w.total),1);
      return(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {stats.people.map(p=>(
            <div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${p.color}`,borderRadius:14,padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
                <span style={{fontSize:22}}>{p.emoji}</span>
                <span style={{fontFamily:"'Lora',serif",fontSize:18,color:p.color}}>{p.name}</span>
                <span style={{marginLeft:"auto",fontFamily:"'Lora',serif",fontSize:28,color:p.color}}>{p.total}</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[["Today",p.today],["This week",p.week],["This month",p.month]].map(([l,v])=>(
                  <div key={l} style={{textAlign:"center",background:p.color+"11",borderRadius:8,padding:"8px 4px"}}>
                    <div style={{fontSize:9,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:3}}>{l}</div>
                    <div style={{fontFamily:"'Lora',serif",fontSize:22,color:p.color}}>{v}</div>
                  </div>
                ))}
              </div>
              {stats.total>0&&(
                <div style={{marginTop:10}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em"}}>Share of total</span>
                    <span style={{fontSize:11,color:p.color}}>{Math.round(p.total/stats.total*100)}%</span>
                  </div>
                  <div style={{background:C.dim,borderRadius:4,height:6,overflow:"hidden"}}>
                    <div style={{width:`${(p.total/stats.total)*100}%`,background:p.color,height:"100%",borderRadius:4}}/>
                  </div>
                </div>
              )}
            </div>
          ))}
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:"16px"}}>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:14}}>Last 8 weeks</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:5,height:90}}>
              {stats.weeks.map((w,wi)=>{
                const pct=(w.total/maxW)*100;
                return(
                  <div key={wi} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    {w.total>0&&<div style={{fontSize:8,color:C.muted}}>{w.total}</div>}
                    <div style={{width:"100%",height:`${Math.max(pct,3)}%`,minHeight:3,borderRadius:4,overflow:"hidden",display:"flex",flexDirection:"column-reverse"}}>
                      {PEOPLE.map(p=>{const c=w.counts[p.id]||0;if(!c)return null;return<div key={p.id} style={{width:"100%",height:`${(c/Math.max(w.total,1))*100}%`,background:p.color,opacity:wi===7?1:0.7}}/>;  })}
                    </div>
                    <div style={{fontSize:8,color:wi===7?C.text:C.muted,textAlign:"center",lineHeight:1.3,whiteSpace:"pre"}}>{w.label}</div>
                  </div>
                );
              })}
            </div>
            <div style={{display:"flex",gap:12,marginTop:10,flexWrap:"wrap"}}>
              {PEOPLE.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:8,height:8,borderRadius:2,background:p.color}}/><span style={{fontSize:10,color:C.muted}}>{p.name}</span></div>)}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
